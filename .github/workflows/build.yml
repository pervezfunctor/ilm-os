---
name: Build container images

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 18 * * FRI'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "My Customized Universal Blue Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push ${{ matrix.image.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: bazzite-dx-nvidia
            base: ghcr.io/ublue-os/bazzite-dx-nvidia:latest
            build_script: /ctx/build.sh
          - name: bluefin-dx
            base: ghcr.io/ublue-os/bluefin-dx:latest
            build_script: /ctx/build.sh
          - name: fedora-bootc
            base: quay.io/fedora/fedora-bootc:latest
            build_script: /ctx/build-fedora-bootc.sh
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These action versions are pinned by Renovate.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: just check

      - name: Prepare environment
        shell: bash
        env:
          MATRIX_IMAGE_NAME: ${{ matrix.image.name }}
          MATRIX_BASE_IMAGE: ${{ matrix.image.base }}
          MATRIX_BUILD_SCRIPT: ${{ matrix.image.build_script }}
        run: |
          set -euo pipefail

          REPO_IMAGE_NAME="${GITHUB_REPOSITORY##*/}"
          IMAGE_NAME="${REPO_IMAGE_NAME}-${MATRIX_IMAGE_NAME}"
          {
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "REPO_IMAGE_NAME=${REPO_IMAGE_NAME,,}"
            echo "REPO_ORGANIZATION=${GITHUB_REPOSITORY_OWNER,,}"
            echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "BASE_IMAGE=${MATRIX_BASE_IMAGE}"
            echo "BUILD_SCRIPT=${MATRIX_BUILD_SCRIPT}"
            echo "DEFAULT_TAG=latest"
          } >> "${GITHUB_ENV}"

      - name: Image Name
        run: |
          echo "Building $(just image_name)"

      - name: Default Tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "${GITHUB_ENV}"

      - name: Build Image
        id: build-image
        run: |
          sudo -E "$(command -v just)" build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # This is the supported, rootful rechunking path from image-template.
      # It creates smaller OSTree deltas without changing the published image
      # name or the tags generated below.
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          sudo -E "$(command -v just)" ostree-rechunk \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      # The distro-agnostic alternative remains available locally with:
      #   sudo just rechunk IMAGE_NAME DEFAULT_TAG

      - name: Generate Build Tags
        id: gen-build-tags
        shell: bash
        run: |
          set -euo pipefail

          alias_tags="$(just generate-build-tags \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}")"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          sudo -E "$(command -v just)" tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # Do not publish pull request builds. This keeps the existing GHCR
      # image names while allowing the matrix to validate every variant.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        shell: bash
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail

          for tag in ${ALIAS_TAGS}; do
            sudo -E podman push \
              --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${tag}" \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # This remains compatible with the existing Cosign v2 setup in ilm-os.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
