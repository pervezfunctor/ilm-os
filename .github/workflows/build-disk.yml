---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        description: "Platform Architecture"
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/iso*.toml'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ (inputs.platform || 'amd64') == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
        image:
          - variant: bazzite-dx-nvidia
            base: ghcr.io/ublue-os/bazzite-dx-nvidia:latest
            iso_config: disk_config/iso-bazzite.toml
          - variant: bluefin-dx
            base: ghcr.io/ublue-os/bluefin-dx:latest
            iso_config: disk_config/iso-bluefin.toml
          - variant: fedora-bootc
            base: quay.io/fedora/fedora-bootc:latest
            iso_config: disk_config/iso-fedora.toml
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          DISK_TYPE="${{ matrix.disk-type }}"
          IMAGE_VARIANT="${{ matrix.image.variant }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR builds validate the current disk workflow against its upstream
            # base. Custom images are intentionally not published from PRs.
            IMAGE_REFERENCE="${{ matrix.image.base }}"
          else
            IMAGE_REFERENCE="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}-${IMAGE_VARIANT}:${DEFAULT_TAG}"
          fi
          # Lowercase the image uri
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "DISK_TYPE=${DISK_TYPE}"
            echo "USER_UID=${USER_UID}"
            echo "USER_GID=${USER_GID}"
            echo "IMAGE_VARIANT=${IMAGE_VARIANT}"
            echo "IMAGE_REFERENCE=${IMAGE_REFERENCE}"
          } >> "${GITHUB_ENV}"

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render disk config
        id: config
        env:
          IMAGE_REFERENCE: ${{ env.IMAGE_REFERENCE }}
        run: |
          if ! command -v envsubst >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gettext-base
          fi
          if [[ "${{ matrix.disk-type }}" == "anaconda-iso" ]]; then
            CONFIG_FILE="./${{ matrix.image.iso_config }}"
          else
            CONFIG_FILE="./disk_config/disk.toml"
          fi
          RENDERED_PATH="${RUNNER_TEMP}/config-${{ matrix.disk-type }}-${{ matrix.image.variant }}.toml"
          envsubst < "${CONFIG_FILE}" > "${RENDERED_PATH}"
          echo "path=${RENDERED_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" | sudo podman login ghcr.io \
            --username "${REGISTRY_USER}" \
            --password-stdin

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@30960621b85c9e76c653082f9ef4cab5a10210d5 # main
        with:
          config-file: ${{ steps.config.outputs.path }}
          image: ${{ env.IMAGE_REFERENCE }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          rootfs: btrfs
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy "${SOURCE_DIR}" "S3:${{ secrets.S3_BUCKET_NAME }}"
